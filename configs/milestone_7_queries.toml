# Fixed text queries map to the Agriculture-Vision annotation vocabulary.
# They measure zero-shot text-to-image ranking against labels, not free-form
# semantic correctness. The second phrase per class checks prompt sensitivity.

[[queries]]
id = "double_plant_canonical"
category = "double_plant"
text = "An aerial farmland image showing a double-plant pattern in crop rows."
audit = true

