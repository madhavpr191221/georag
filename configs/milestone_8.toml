[reproducibility]
seed = 17

[dataset]
adapter = "sen12flood_s2"
root = "data/sen12flood/sen12flood"
bands = [
    "B01", "B02", "B03", "B04", "B05", "B06", "B07",
    "B08", "B8A", "B09", "B11", "B12",
]
target_resolution_m = 20.0
target_grid_band = "B05"
value_scale = 1.0
missing_asset_policy = "catalog_but_exclude_from_dataset"

[split]
manifest = "data/splits/sen12flood_s2_seed_17.csv"
train_fraction = 0.80
validation_fraction = 0.10
test_fraction = 0.10
seed = 17
group_field = "sequence_id"

[resampling]
finer_than_target = "average"
coarser_than_target = "bilinear"
same_resolution = "nearest"
nodata_fill = 0.0
validity = "intersection_of_all_selected_bands"
