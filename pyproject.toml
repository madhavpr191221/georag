[project]
name = "georag"
version = "0.1.0"
description = "Retrieval-oriented representation and indexing experiments for EO/IR imagery"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "huggingface-hub>=2.1.1",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "open-clip-torch>=3.3.0",
    "openai>=3.24.0",
    "pillow>=11.3.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
    "rasterio>=1.4.4",
    "torch>=2.11.0",
]

[dependency-groups]
dev = ["pytest>=9.0.0"]

[build-system]
requires = ["uv_build>=0.12.13,<0.13"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.uv.sources]
torch = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
